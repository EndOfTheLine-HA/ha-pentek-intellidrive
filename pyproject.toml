[project]
name = "ha-pentek-intellidrive"
version = "0.1.1"
requires-python = ">=3.14.2"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
